name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      branch:
        description: >
          Branch to deploy. Leave empty to use the branch chosen in
          "Use workflow from" (that dropdown lists every branch in the repo).
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref_name }}
      - uses: ./.github/actions/setup
      - run: pnpm test

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref_name }}
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref_name }}
      - uses: ./.github/actions/setup
      - run: pnpm lint

  lint-fsd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref_name }}
      - uses: ./.github/actions/setup
      - run: pnpm lint:fsd

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref_name }}
      - uses: ./.github/actions/setup
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: [test, e2e, lint, lint-fsd, build]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
